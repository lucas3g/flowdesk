name: flowdesk
description: "FlowDesk — gerenciador de janelas e layouts de trabalho para macOS."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: 1.0.9
  flutter_bloc: 9.1.1
  equatable: 3.0.0
  fpdart: 1.2.0
  get_it: 9.2.1
  injectable: 3.0.0
  drift: 2.35.0
  drift_flutter: 0.3.1
  sqlite3_flutter_libs: 0.6.0+eol
  window_manager: 0.5.2
  intl: 0.20.3
  path_provider: 2.1.6
  file_selector: 1.1.0
  http: 1.6.0
  url_launcher: 6.3.2
  cryptography: 2.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 6.0.0
  injectable_generator: 3.1.3
  build_runner: 2.16.1
  drift_dev: 2.35.0
  bloc_test: 10.0.0
  mocktail: 1.0.5

flutter:
  uses-material-design: true

  fonts:
    - family: MaterialSymbolsRounded
      fonts:
        - asset: assets/fonts/MaterialSymbolsRounded.ttf
